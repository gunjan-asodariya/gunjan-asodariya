<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A56"/>
      <stop offset="55%" stop-color="#2C4A82"/>
      <stop offset="100%" stop-color="#3E6FA8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6E9BD6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6E9BD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5FC3D9"/>
      <stop offset="100%" stop-color="#3E8FBF"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A6FA6"/>
      <stop offset="100%" stop-color="#2A5085"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="280" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="280" fill="url(#glow)"/>

  <!-- faint background symbols -->
  <g font-family="'JetBrains Mono',Consolas,monospace" fill="#FFFFFF" opacity="0.10">
    <text x="55" y="55" font-size="26">{'}'}</text>
    <text x="520" y="35" font-size="20">;</text>
    <text x="1000" y="50" font-size="22">01</text>
    <text x="45" y="150" font-size="30">&#955;</text>
    <text x="110" y="230" font-size="24">&lt;/&gt;</text>
    <text x="1080" y="200" font-size="24">{'{'}</text>
  </g>

  <!-- name -->
  <text x="600" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="1">GUNJAN ASODARIYA</text>

  <!-- subtitle + cursor -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="22" fill="#D9E4F5">
    <text x="600" y="182" text-anchor="middle">B.Tech CSE Student @ CodingGita</text>
  </g>
  <rect x="822" y="163" width="4" height="26" fill="#5FE0D0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>

  <!-- layered wave footer -->
  <path d="M0,235 C 150,215 300,250 450,232 C 600,214 750,248 900,230 C 1000,218 1100,232 1200,222 L1200,280 L0,280 Z" fill="url(#waveGrad1)" opacity="0.85"/>
  <path d="M0,255 C 180,240 360,268 540,254 C 700,242 880,266 1050,252 C 1100,248 1150,252 1200,248 L1200,280 L0,280 Z" fill="url(#waveGrad2)"/>
</svg>
