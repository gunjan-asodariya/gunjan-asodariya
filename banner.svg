<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A56">
        <animate attributeName="stop-color" values="#1B2A56;#22366A;#1B2A56" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#2C4A82">
        <animate attributeName="stop-color" values="#2C4A82;#345A98;#2C4A82" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3E6FA8">
        <animate attributeName="stop-color" values="#3E6FA8;#4A81BE;#3E6FA8" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6E9BD6" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.5;0.35" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#6E9BD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5FC3D9"/>
      <stop offset="100%" stop-color="#3E8FBF"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A6FA6"/>
      <stop offset="100%" stop-color="#2A5085"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="280" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="280" fill="url(#glow)"/>

  <!-- faint drifting background symbols -->
  <g font-family="'JetBrains Mono',Consolas,monospace" fill="#FFFFFF">
    <text x="55" y="55" font-size="26" opacity="0.10">{'}'}
      <animateMotion path="M0,0 C 6,-16 -6,-34 2,-55" dur="10s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.14;0.14;0" keyTimes="0;0.15;0.8;1" dur="10s" begin="-1s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="35" font-size="20" opacity="0.10">;
      <animateMotion path="M0,0 C -5,-14 5,-30 -2,-48" dur="8s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.16;0.16;0" keyTimes="0;0.15;0.8;1" dur="8s" begin="-3s" repeatCount="indefinite"/>
    </text>
    <text x="1000" y="50" font-size="22" opacity="0.10">01
      <animateMotion path="M0,0 C 6,-18 -6,-36 3,-58" dur="11s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.14;0.14;0" keyTimes="0;0.15;0.8;1" dur="11s" begin="-5s" repeatCount="indefinite"/>
    </text>
    <text x="45" y="150" font-size="30" opacity="0.10">&#955;
      <animateMotion path="M0,0 C -7,-20 7,-40 -3,-64" dur="9s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.14;0.14;0" keyTimes="0;0.15;0.8;1" dur="9s" begin="-2s" repeatCount="indefinite"/>
    </text>
    <text x="110" y="230" font-size="24" opacity="0.10">&lt;/&gt;
      <animateMotion path="M0,0 C 6,-16 -6,-34 2,-55" dur="10.5s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.14;0.14;0" keyTimes="0;0.15;0.8;1" dur="10.5s" begin="-6s" repeatCount="indefinite"/>
    </text>
    <text x="1080" y="200" font-size="24" opacity="0.10">{'{'}
      <animateMotion path="M0,0 C -6,-18 6,-38 -2,-60" dur="9.5s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.14;0.14;0" keyTimes="0;0.15;0.8;1" dur="9.5s" begin="-4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- name -->
  <text x="600" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    GUNJAN ASODARIYA
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- subtitle + cursor -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="22" fill="#D9E4F5">
    <text x="600" y="182" text-anchor="middle">
      B.Tech CSE Student @ CodingGita
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.6s" fill="freeze"/>
    </text>
  </g>
  <rect x="822" y="163" width="4" height="26" fill="#5FE0D0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="1.6s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>

  <!-- layered wave footer, gentle parallax drift -->
  <path d="M0,235 C 150,215 300,250 450,232 C 600,214 750,248 900,230 C 1000,218 1100,232 1200,222 L1200,280 L0,280 Z" fill="url(#waveGrad1)" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0,0;-25,0;0,0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0,255 C 180,240 360,268 540,254 C 700,242 880,266 1050,252 C 1100,248 1150,252 1200,248 L1200,280 L0,280 Z" fill="url(#waveGrad2)">
    <animateTransform attributeName="transform" type="translate" values="0,0;20,0;0,0" dur="11s" repeatCount="indefinite"/>
  </path>
</svg>
